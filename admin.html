<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#8a2be2">
<title>XITEXE — Admin Control Deck</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --purple:#8a2be2;--purple2:#da70d6;--violet:#b14aff;--magenta:#ff4ad9;
  --dark:#06030f;--card:#140a2e;--border:rgba(138,43,226,0.35);
}
body{font-family:'Rajdhani','Segoe UI',sans-serif;background:linear-gradient(135deg,#06030f,#1a0a3a);color:#fff;min-height:100vh;padding:15px 15px 80px;position:relative;overflow-x:hidden;}
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse at 15% 10%, rgba(138,43,226,0.3), transparent 50%),
    radial-gradient(ellipse at 85% 90%, rgba(255,74,217,0.22), transparent 55%);
  animation:aurora 14s ease-in-out infinite alternate;
}
@keyframes aurora{0%{transform:translate(0,0) scale(1);}50%{transform:translate(-2%,2%) scale(1.05);}100%{transform:translate(2%,-2%) scale(1);}}
#bgCanvas{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0.35;}
.container{max-width:760px;margin:0 auto;position:relative;z-index:2;}

/* HEADER */
.header{
  background:linear-gradient(90deg,#8a2be2,#da70d6,#ff4ad9,#8a2be2);
  background-size:300% 100%;animation:headerCycle 8s linear infinite;
  padding:18px 20px;border-radius:18px;text-align:center;margin-bottom:22px;
  box-shadow:0 8px 30px rgba(138,43,226,0.5);
  display:flex;align-items:center;gap:14px;justify-content:center;
}
@keyframes headerCycle{0%{background-position:0% 50%;}100%{background-position:300% 50%;}}
.header-logo{width:52px;height:52px;border-radius:14px;overflow:hidden;border:2px solid #fff;flex-shrink:0;box-shadow:0 0 20px rgba(0,0,0,0.4);}
.header-logo img{width:100%;height:100%;object-fit:cover;}
.header h1{font-family:'Orbitron',sans-serif;font-size:18px;font-weight:800;letter-spacing:2px;}
.header p{font-size:12px;opacity:0.92;margin-top:2px;}

/* SECTIONS */
.section{background:rgba(20,10,46,0.6);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:16px;margin-bottom:12px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,0.3);}
.sec-hdr{padding:16px 18px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,0.25);transition:0.2s;}
.sec-hdr:hover{background:rgba(138,43,226,0.18);}
.sec-hdr h2{font-family:'Orbitron',sans-serif;color:var(--purple2);font-size:14px;display:flex;align-items:center;gap:8px;letter-spacing:1px;}
.sec-hdr .chev{color:var(--purple2);font-size:14px;transition:0.2s;}
.sec-body{padding:0 18px 18px;display:none;}
.sec-body.open{display:block;}
.sec-hdr.open .chev{transform:rotate(180deg);}

/* FORM */
.fg{margin-bottom:13px;}
label{display:block;margin-bottom:5px;color:#bba8db;font-size:12px;font-weight:600;letter-spacing:0.5px;}
input,textarea,select{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:10px;background:rgba(0,0,0,0.45);color:#fff;font-size:14px;outline:none;font-family:inherit;transition:0.2s;}
input:focus,textarea:focus,select:focus{border-color:var(--purple2);box-shadow:0 0 16px rgba(218,112,214,0.3);}
textarea{resize:vertical;min-height:70px;}

/* CYCLING BUTTONS */
@keyframes btnCycle{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}
@keyframes btnGlow{0%,100%{box-shadow:0 4px 16px rgba(138,43,226,0.4);}50%{box-shadow:0 6px 24px rgba(218,112,214,0.6);}}
.btn{padding:11px 18px;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;transition:transform 0.15s;display:inline-flex;align-items:center;gap:6px;margin:4px 4px 4px 0;color:#fff;font-family:inherit;}
.btn:active{transform:scale(0.97);}
.btn-red{
  background:linear-gradient(90deg,#8a2be2,#da70d6,#b14aff,#ff4ad9,#8a2be2);
  background-size:300% 100%;
  animation:btnCycle 5s linear infinite, btnGlow 2.4s ease-in-out infinite;
}
.btn-green{background:#22c55e;}
.btn-danger{background:#ef4444;}
.btn-blue{background:#3b82f6;}
.btn-gray{background:rgba(255,255,255,0.08);color:#ccc;border:1px solid rgba(255,255,255,0.1);}

/* LIST */
.list-item{background:rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.06);padding:12px;border-radius:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
.list-item-info{flex:1;}
.list-item-info strong{color:var(--purple2);font-size:14px;}
.list-item-info small{display:block;color:#999;font-size:11px;margin-top:2px;}

/* PREVIEW */
.preview{margin-top:8px;width:80px;height:80px;border-radius:10px;overflow:hidden;border:1.5px solid var(--border);background:rgba(0,0,0,0.3);display:none;}
.preview img{width:100%;height:100%;object-fit:cover;}

/* TOAST */
.toast{position:fixed;top:18px;right:18px;padding:12px 20px;border-radius:12px;color:#fff;font-weight:700;z-index:9999;font-size:13px;animation:slideIn 0.3s ease;box-shadow:0 6px 24px rgba(0,0,0,0.4);}
@keyframes slideIn{from{transform:translateX(300px);opacity:0;}to{transform:translateX(0);opacity:1;}}

/* PASSWORD DISPLAY */
.pass-display{background:rgba(138,43,226,0.12);border:2px solid var(--purple2);border-radius:12px;padding:14px;text-align:center;margin-bottom:12px;}
.pass-display span{font-family:'Orbitron',sans-serif;font-size:28px;font-weight:900;letter-spacing:10px;color:#ffd166;text-shadow:0 0 12px rgba(255,209,102,0.5);}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(max-width:400px){.grid2{grid-template-columns:1fr;}}

.cat-item{background:rgba(0,0,0,0.35);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;}
.cat-item img{width:40px;height:40px;border-radius:8px;object-fit:cover;}



::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-track{background:rgba(0,0,0,0.2);}
::-webkit-scrollbar-thumb{background:var(--purple);border-radius:6px;}

/* XITEXE ADMIN // CONTROL DECK */
:root{--purple:#2f74e8;--purple2:#7ce7ff;--violet:#1749a3;--magenta:#4ddcff;--dark:#020712;--card:#07182d;--border:rgba(91,205,255,.18)}
html{background:#020712}body{font-family:'Space Grotesk','Rajdhani',sans-serif;background:radial-gradient(ellipse at 12% 0%,rgba(35,104,210,.25),transparent 42%),radial-gradient(ellipse at 92% 90%,rgba(0,205,255,.12),transparent 42%),linear-gradient(145deg,#020712,#061326 52%,#020711);color:#e9f8ff}body:before{background:linear-gradient(rgba(95,194,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(95,194,255,.035) 1px,transparent 1px),radial-gradient(circle at 50% 15%,rgba(47,155,255,.14),transparent 50%);background-size:40px 40px,40px 40px,100% 100%}#bgCanvas{opacity:.15;mix-blend-mode:screen}.container{max-width:940px}.header{position:relative;overflow:hidden;background:linear-gradient(105deg,#0b2b66,#087da9 45%,#112c83);background-size:220% 100%;animation:adminFlow 12s ease-in-out infinite;padding:20px 22px;border:1px solid rgba(130,228,255,.3);border-radius:22px;box-shadow:0 20px 50px rgba(0,0,0,.38),0 0 36px rgba(33,174,255,.14)}@keyframes adminFlow{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}.header:before{content:'';position:absolute;inset:0;background:linear-gradient(transparent 49%,rgba(135,235,255,.12) 50%,transparent 51%);background-size:100% 8px;opacity:.45;pointer-events:none}.header-logo{width:58px;height:58px;border-radius:16px;border-color:rgba(226,251,255,.82);box-shadow:0 0 24px rgba(58,213,255,.32)}.header h1{font:800 clamp(15px,3.8vw,22px) Orbitron,sans-serif;letter-spacing:1.5px;text-shadow:0 0 18px rgba(105,229,255,.36)}.header p{color:#d0f4ff;letter-spacing:1.3px}.header p .status-dot{margin-right:7px}.section{background:linear-gradient(145deg,rgba(8,29,55,.82),rgba(3,13,27,.84));border-color:rgba(107,205,255,.16);border-radius:18px;box-shadow:0 14px 36px rgba(0,0,0,.24),inset 0 1px rgba(255,255,255,.035)}.sec-hdr{background:rgba(4,18,34,.52);border-bottom-color:rgba(106,204,255,.07)}.sec-hdr:hover{background:rgba(32,128,187,.16)}.sec-hdr h2{font:700 13px Orbitron,sans-serif;color:#8be9ff;text-shadow:0 0 12px rgba(88,215,255,.25)}.sec-hdr .chev{color:#65ddff}label{color:#8eaec7;font-family:'Space Grotesk',sans-serif;text-transform:uppercase}input,textarea,select{background:rgba(2,12,24,.76);border-color:rgba(99,195,255,.18);color:#effaff;border-radius:11px}input:focus,textarea:focus,select:focus{border-color:#61dcff;box-shadow:0 0 18px rgba(49,190,255,.2)}.btn{font-family:'Space Grotesk',sans-serif;border-radius:11px}.btn-red{background:linear-gradient(100deg,#2366dd,#35d8ff,#2366dd);background-size:220% 100%;animation:btnFlow 6s ease-in-out infinite,btnGlow 2.8s ease-in-out infinite;color:#02101e}@keyframes btnFlow{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}@keyframes btnGlow{0%,100%{box-shadow:0 5px 16px rgba(36,125,225,.24)}50%{box-shadow:0 8px 26px rgba(46,209,255,.38)}}.btn-green{background:#1dcf88;color:#02150d}.btn-danger{background:#e94f76}.btn-blue{background:#287fe5}.btn-gray{background:rgba(122,191,230,.09);border-color:rgba(112,204,255,.16);color:#c2e6f5}.list-item,.cat-item{background:rgba(2,14,27,.66);border-color:rgba(104,198,255,.12)}.list-item-info strong{color:#86e9ff}.list-item-info small{color:#7996ae}.pass-display{background:rgba(29,128,222,.1);border-color:#48d7ff;box-shadow:0 0 25px rgba(32,169,255,.12)}.pass-display span{color:#bdf4ff;text-shadow:0 0 16px rgba(76,225,255,.65)}.toast{background:linear-gradient(100deg,#0c3c7e,#0c9ec2)!important;border:1px solid rgba(160,243,255,.35);box-shadow:0 0 28px rgba(35,183,255,.28)}@media(max-width:560px){body{padding:10px 10px 60px}.header{padding:16px 13px}.header-logo{width:48px;height:48px}.header h1{font-size:14px}.header p{font-size:10px}.sec-body{padding-inline:14px}.sec-hdr{padding-inline:14px}}
</style>
</head>

<script>
// ===== ANIMATED BG =====
var canvas=document.getElementById('bgCanvas');
var ctx=canvas.getContext('2d');
function rs(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}rs();window.addEventListener('resize',rs);
var ps=[];var COL=['#8a2be2','#da70d6','#b14aff','#ff4ad9'];
function P(){this.x=Math.random()*canvas.width;this.y=canvas.height+Math.random()*100;this.vx=(Math.random()-0.5)*0.8;this.vy=-(Math.random()*1.2+0.4);this.life=1;this.decay=Math.random()*0.005+0.002;this.size=Math.random()*3+1;this.color=COL[Math.floor(Math.random()*COL.length)];}
P.prototype.update=function(){this.x+=this.vx;this.y+=this.vy;this.life-=this.decay;};
function anim(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(ps.length<80)ps.push(new P());
  ps=ps.filter(function(p){return p.life>0;});
  ps.forEach(function(p){p.update();var g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.size*4);g.addColorStop(0,p.color);g.addColorStop(1,'transparent');ctx.globalAlpha=p.life*0.6;ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.size*4,0,Math.PI*2);ctx.fill();});
  ctx.globalAlpha=1;requestAnimationFrame(anim);
}
anim();

var firebaseConfig={apiKey:"AIzaSyCgLyeHPz9yZFi18tHVf-tCvRV3k8rRugg",authDomain:"my-website-broken.firebaseapp.com",databaseURL:"https://my-website-broken-default-rtdb.europe-west1.firebasedatabase.app",projectId:"my-website-broken",storageBucket:"my-website-broken.firebasestorage.app",messagingSenderId:"372626370117",appId:"1:372626370117:web:6e0c0cc817ab7829b43d2c"};
firebase.initializeApp(firebaseConfig);
var db=firebase.database();
var CLOUDINARY_CLOUD="dnw4w6gzn";
var CLOUDINARY_PRESET="ml_default";
var CLOUDINARY_API_KEY="399513211992728";


function initAdmin(){loadCategories();loadItemsList();loadHacksList();loadHotSale();loadInfoPages();}
initAdmin();

function showToast(msg,color){
  var t=document.createElement('div');t.className='toast';
  t.style.background=color||'linear-gradient(90deg,#8a2be2,#da70d6,#ff4ad9)';
  t.style.backgroundSize='200% 100%';
  t.textContent=msg;document.body.appendChild(t);
  setTimeout(function(){t.remove();},3500);
}

function toggleSec(hdr,id){
  var el=document.getElementById(id);
  el.classList.toggle('open');hdr.classList.toggle('open');
}

function previewImg(input,previewId){
  var prev=document.getElementById(previewId);
  if(input.files&&input.files[0]){
    var f=input.files[0];
    if(f.type && f.type.indexOf('image/')===0){
      var reader=new FileReader();
      reader.onload=function(e){prev.style.display='block';prev.querySelector('img').src=e.target.result;};
      reader.readAsDataURL(f);
    } else {
      prev.style.display='block';
      prev.querySelector('img').src='';
      prev.innerHTML='<div style="padding:14px;font-size:12px;color:#bba8db;text-align:center;">📎 '+f.name+'<br>('+Math.round(f.size/1024)+' KB)</div>';
    }
  }
}

// Cloudinary /auto/upload — works for image, video and raw files
async function uploadToCloudinary(file){
  var fd=new FormData();
  fd.append('file',file);
  fd.append('upload_preset',CLOUDINARY_PRESET);
  var res=await fetch('https://api.cloudinary.com/v1_1/'+CLOUDINARY_CLOUD+'/auto/upload',{method:'POST',body:fd});
  var data=await res.json();
  if(!res.ok || !data.secure_url){
    var msg=(data && data.error && data.error.message)||('Upload failed ('+res.status+')');
    throw new Error(msg);
  }
  return data.secure_url;
}


/* ===== HOT SALE / PUSH AD ===== */
function loadHotSale(){
  db.ref('skintools2/hotSale').once('value').then(function(snap){
    var el=document.getElementById('hotCurrent');
    if(!snap.exists()){el.textContent='No active hot sale';return;}
    var h=snap.val();
    el.innerHTML='🔥 Active: <span style="color:#fff;">'+h.name+'</span> · '+h.price+' · delay '+h.delay+'s · countdown '+h.countdown+'s';
    document.getElementById('hotName').value=h.name||'';
    document.getElementById('hotPrice').value=h.price||'';
    document.getElementById('hotDelay').value=h.delay||5;
    document.getElementById('hotCountdown').value=h.countdown||10;
    document.getElementById('hotImgUrl').value=h.imageUrl||'';
    document.getElementById('hotMsg').value=h.buyMsg||'';
  });
}
function pushHotSale(){
  var name=document.getElementById('hotName').value.trim();
  var price=document.getElementById('hotPrice').value.trim();
  var delay=parseInt(document.getElementById('hotDelay').value)||0;
  var countdown=parseInt(document.getElementById('hotCountdown').value)||0;
  var urlVal=document.getElementById('hotImgUrl').value.trim();
  var file=document.getElementById('hotImg').files[0];
  var buyMsg=document.getElementById('hotMsg').value.trim()||('Hi XITEXE, I want to buy: '+name);
  if(!name||!price){showToast('Enter name and price','#f59e0b');return;}
  function save(imgUrl){
    if(!imgUrl){showToast('Add an image (upload or URL)','#f59e0b');return;}
    db.ref('skintools2/hotSale').set({name:name,price:price,delay:delay,countdown:countdown,imageUrl:imgUrl,buyMsg:buyMsg,timestamp:Date.now()}).then(function(){
      showToast('✅ Hot Sale sent live!');loadHotSale();
    });
  }
  if(file){
    showToast('⏳ Uploading...');
    uploadToCloudinary(file).then(save).catch(function(e){showToast('❌ '+e.message,'#ef4444');});
  } else save(urlVal);
}
function clearHotSale(){if(!confirm('Clear hot sale?'))return;db.ref('skintools2/hotSale').remove().then(function(){showToast('🗑️ Cleared');document.getElementById('hotCurrent').textContent='No active hot sale';});}

function loadCategories(){
  db.ref('skintools2/categories').once('value').then(function(snap){
    var list=document.getElementById('catList');
    var catSelect=document.getElementById('itemCat');
    var filterSelect=document.getElementById('filterCat');
    list.innerHTML='';
    catSelect.innerHTML='<option value="">-- Select Category --</option>';
    filterSelect.innerHTML='<option value="all">All Categories</option>';
    if(!snap.exists()){list.innerHTML='<div style="color:#888;text-align:center;padding:15px;">No categories yet</div>';return;}
    var cats=snap.val();
    Object.keys(cats).forEach(function(key){
      var cat=cats[key];
      var div=document.createElement('div');div.className='cat-item';div.style.display='flex';div.style.alignItems='center';div.style.gap='10px';
      var iconHtml=cat.iconUrl
        ? '<img src="'+cat.iconUrl+'" onerror="this.outerHTML=\'<div style=&quot;width:40px;height:40px;background:rgba(138,43,226,0.18);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;&quot;>🖼️</div>\'">'
        : '<div style="width:40px;height:40px;background:rgba(138,43,226,0.18);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;">🖼️</div>';
      div.innerHTML=iconHtml+
        '<div style="flex:1"><strong style="color:var(--purple2)">'+cat.name+'</strong><br><small style="color:#888">'+key+'</small></div>'+
        '<button class="btn btn-danger" style="padding:8px 12px;" onclick="deleteCategory(\''+key+'\')">🗑️</button>';
      list.appendChild(div);
      var opt1=document.createElement('option');opt1.value=key;opt1.textContent=cat.name;catSelect.appendChild(opt1);
      var opt2=opt1.cloneNode(true);filterSelect.appendChild(opt2);
    });
  });
}
function addCategory(){
  var name=document.getElementById('catName').value.trim();
  var file=document.getElementById('catIcon').files[0];
  var urlVal=document.getElementById('catIconUrl').value.trim();
  if(!name){showToast('Enter category name','#f59e0b');return;}
  var key=name.toLowerCase().replace(/\s+/g,'_').replace(/[^a-z0-9_]/g,'')+'_'+Date.now();
  function save(url){
    db.ref('skintools2/categories/'+key).set({name:name,iconUrl:url||'',createdAt:Date.now()}).then(function(){
      showToast('✅ Category added!');
      document.getElementById('catName').value='';
      document.getElementById('catIcon').value='';document.getElementById('catIconPrev').style.display='none';
      document.getElementById('catIconUrl').value='';
      loadCategories();
    });
  }
  if(file){
    showToast('⏳ Uploading icon...');
    uploadToCloudinary(file).then(save).catch(function(e){showToast('❌ Upload failed: '+e.message,'#ef4444');});
  } else save(urlVal);
}
function deleteCategory(key){if(!confirm('Delete this category?'))return;db.ref('skintools2/categories/'+key).remove().then(function(){showToast('🗑️ Deleted');loadCategories();});}

function addItem(){
  var cat=document.getElementById('itemCat').value;
  var name=document.getElementById('itemName').value.trim();
  var link=document.getElementById('itemLink').value.trim();

  if(!cat||!name||!link){showToast('Fill category, name, link','#f59e0b');return;}

  var sources=[
    {file:document.getElementById('itemImg').files[0],  url:document.getElementById('itemImgUrl').value.trim()},
    {file:document.getElementById('itemImg2').files[0], url:document.getElementById('itemImg2Url').value.trim()},
    {file:document.getElementById('itemImg3').files[0], url:document.getElementById('itemImg3Url').value.trim()}
  ];
  if(!sources[0].file && !sources[0].url){showToast('Add a main image (upload or URL)','#f59e0b');return;}

  showToast('⏳ Uploading...');
  Promise.all(sources.map(function(s){
    if(s.file) return uploadToCloudinary(s.file);
    return Promise.resolve(s.url||'');
  })).then(function(urls){
    db.ref('skintools2/items').push({
      category:cat,name:name,
      imageUrl:urls[0],
      imageUrl2:urls[1]||'',
      imageUrl3:urls[2]||'',
      downloadLink:link,timestamp:Date.now()
    }).then(function(){
      showToast('✅ Item added!');
      ['itemName','itemImg','itemImgUrl','itemImg2','itemImg2Url','itemImg3','itemImg3Url','itemLink'].forEach(function(id){document.getElementById(id).value='';});
      ['itemImgPrev','itemImg2Prev','itemImg3Prev'].forEach(function(id){document.getElementById(id).style.display='none';});

      loadItemsList();
    });
  }).catch(function(e){showToast('❌ Upload failed: '+e.message,'#ef4444');});
}

function loadItemsList(){
  var filter=document.getElementById('filterCat').value;
  var list=document.getElementById('itemsList');
  list.innerHTML='<div style="color:#888;text-align:center;padding:15px;">Loading...</div>';
  var ref=db.ref('skintools2/items');
  if(filter!=='all')ref=ref.orderByChild('category').equalTo(filter);
  ref.once('value').then(function(snap){
    list.innerHTML='';
    if(!snap.exists()){list.innerHTML='<div style="color:#888;text-align:center;padding:15px;">No items</div>';return;}
    var items=snap.val();
    var arr=Object.keys(items).map(function(k){return Object.assign({id:k},items[k]);});
    arr.sort(function(a,b){return (b.timestamp||0)-(a.timestamp||0);});
    arr.forEach(function(item){
      var div=document.createElement('div');div.className='list-item';
      div.innerHTML=(item.imageUrl?'<img src="'+item.imageUrl+'" style="width:44px;height:44px;border-radius:8px;object-fit:cover;">':'')+
        '<div class="list-item-info"><strong>'+item.name+'</strong><small>'+item.category+' · VPLINK KEY UNLOCK</small></div>'+
        '<button class="btn btn-danger" style="padding:7px 11px;" onclick="deleteItem(\''+item.id+'\')">🗑️</button>';
      list.appendChild(div);
    });
  });
}
function deleteItem(id){if(!confirm('Delete this item?'))return;db.ref('skintools2/items/'+id).remove().then(function(){showToast('🗑️ Deleted');loadItemsList();});}

function addHack(){var name=document.getElementById('hackName').value.trim();if(!name)return;db.ref('skintools2/buyHacks').push({name:name,timestamp:Date.now()}).then(function(){showToast('✅ Added!');document.getElementById('hackName').value='';loadHacksList();});}
function loadHacksList(){db.ref('skintools2/buyHacks').once('value').then(function(snap){var list=document.getElementById('hacksList');list.innerHTML='';if(!snap.exists())return;var hacks=snap.val();Object.keys(hacks).forEach(function(key){var h=hacks[key];var div=document.createElement('div');div.className='list-item';div.innerHTML='<div class="list-item-info"><strong>'+h.name+'</strong></div><button class="btn btn-danger" style="padding:7px 11px;" onclick="deleteHack(\''+key+'\')">🗑️</button>';list.appendChild(div);});});}
function deleteHack(key){db.ref('skintools2/buyHacks/'+key).remove().then(function(){showToast('🗑️ Deleted');loadHacksList();});}

function loadInfoPages(){
  db.ref('skintools2/info').once('value').then(function(snap){
    var d=snap.val()||{};
    if(d.setup){document.getElementById('setupVideoUrl').value=d.setup.videoUrl||'';document.getElementById('setupText').value=d.setup.text||'';}
    if(d.howWorks)document.getElementById('howWorksText').value=d.howWorks.text||'';
    if(d.howLocate)document.getElementById('howLocateText').value=d.howLocate.text||'';
    if(d.about)document.getElementById('aboutText').value=d.about.text||'';
  });
}
function saveInfo(key){
  var data={};
  if(key==='setup')data={videoUrl:document.getElementById('setupVideoUrl').value,text:document.getElementById('setupText').value};
  else if(key==='howWorks')data={text:document.getElementById('howWorksText').value};
  else if(key==='howLocate')data={text:document.getElementById('howLocateText').value};
  else if(key==='about')data={text:document.getElementById('aboutText').value};
  db.ref('skintools2/info/'+key).set(data).then(function(){showToast('✅ Saved!');});
}
// Clean up old notification/update nodes once
db.ref('skintools2/notification').remove();
db.ref('skintools2/update').remove();
