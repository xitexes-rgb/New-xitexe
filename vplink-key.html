  <style>

    body{display:grid;place-items:center;padding:24px;overflow-x:hidden}

    .panel:after{content:"";position:absolute;left:-20%;right:-20%;top:0;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);box-shadow:0 0 15px var(--cyan);animation:scan 3.4s linear infinite}
    @keyframes scan{to{transform:translateY(480px);opacity:.1}}
    .head{display:flex;align-items:center;gap:10px;font:700 9px monospace;letter-spacing:1.4px;color:#86a9c5}.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 14px var(--green);animation:blink 1.2s steps(2,end) infinite}@keyframes blink{50%{opacity:.35}}

    .sub{text-align:center;margin-top:11px;color:var(--muted);font:700 9px monospace;letter-spacing:3px}
    .status{margin:26px 0 18px;padding:12px;border:1px solid rgba(99,232,255,.16);background:rgba(4,18,34,.7);color:#a9d9e9;font:700 9px/1.7 monospace;text-transform:uppercase}.status b{color:var(--green)}
    .keybox{min-height:78px;display:grid;place-items:center;padding:18px 12px;border:1px dashed rgba(99,232,255,.5);background:linear-gradient(110deg,rgba(17,57,86,.5),rgba(4,17,31,.86));color:var(--cyan);font:800 clamp(15px,4.5vw,22px) monospace;letter-spacing:1.5px;text-align:center;word-break:break-all;box-shadow:inset 0 0 24px rgba(34,165,231,.08),0 0 24px rgba(56,202,255,.08)}

    .foot{margin-top:18px;text-align:center;color:#52718f;font:700 8px/1.7 monospace;letter-spacing:1px}.foot strong{color:#75ddff}.error{color:#ff8ecf;text-align:center;font:700 11px/1.6 monospace;padding:26px 8px}
